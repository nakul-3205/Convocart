<!DOCTYPE html>
<html>
<head><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head>
<body>
<button id="pay">Test Checkout</button>
<script>
document.getElementById('pay').onclick = async () => {
  const res = await fetch('http://localhost:3000/api/cart/checkout-confirm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({
      customerName: 'Test User', phone: '9999999999', address: '123 Test St', pincode: '400001',
    }),
  });
  const order = await res.json();
  if (!order.success) return alert(JSON.stringify(order.error));

  new Razorpay({
    key: order.data.keyId,
    amount: order.data.amount,
    currency: order.data.currency,
    order_id: order.data.razorpayOrderId,
    handler: (r) => alert('Payment success: ' + JSON.stringify(r)),
  }).open();
};
</script>
</body>
</html>
